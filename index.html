<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SARA</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += '<div style="color:red; background:white; position:absolute; z-index:9999; top:0; left:0; width:100%; height:100%; padding:20px;">' +
          '<h1>Unhandled Error</h1>' +
          '<pre>' + message + '</pre>' +
          '<pre>' + source + ':' + lineno + ':' + colno + '</pre>' +
          '<pre>' + (error && error.stack) + '</pre>' +
          '</div>';
      };
      window.onunhandledrejection = function(event) {
        document.body.innerHTML += '<div style="color:red; background:white; position:absolute; z-index:9999; top:0; left:0; width:100%; height:100%; padding:20px;">' +
          '<h1>Unhandled Rejection</h1>' +
          '<pre>' + event.reason + '</pre>' +
          '<pre>' + (event.reason && event.reason.stack) + '</pre>' +
          '</div>';
      };
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
